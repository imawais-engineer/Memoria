name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria
          POSTGRES_DB: memoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://memoria:memoria@localhost:5432/memoria
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Enable pgvector
        env:
          PGPASSWORD: memoria
        run: psql -h localhost -U memoria -d memoria -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Apply migrations (alembic upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://memoria:memoria@localhost:5432/memoria
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1

      - name: Decay SQL tests against migrated schema
        working-directory: backend
        run: pytest -q -rs tests/test_decay_sql_db.py

      - name: Mock OpenAI-compatible provider tests
        working-directory: backend
        run: pytest -q -rs tests/test_llm_providers.py tests/test_live_openai_compat.py

      - name: Run full test suite
        working-directory: backend
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
